name: Assemble Unified XR Project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble compatible XR foundation
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/xr-template /tmp/startup
          git clone --depth 1 https://github.com/GodotVR/godot-xr-template.git /tmp/xr-template
          git clone --depth 1 https://github.com/0SwiftKnightX/Startup.git /tmp/startup

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec rm -rf {} +
          rsync -a --exclude=.git --exclude=README.md /tmp/xr-template/ ./

          rm -rf addons/godotopenxrvendors
          rsync -a /tmp/startup/addons/godotopenxrvendors addons/

          rm -rf docs/startup-reference
          mkdir -p docs/startup-reference
          rsync -a /tmp/startup/docs/ docs/startup-reference/

          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          s = p.read_text()
          s = s.replace('config/name="Godot XR Template"', 'config/name="Personal Quest Development — Unified XR"')
          p.write_text(s)
          PY

      - name: Add exact reference repositories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf references/flynn-demo references/malcolm-demo
          mkdir -p references

          git clone --depth 1 https://github.com/BastiaanOlij/godot-xr-flynn-demo.git references/flynn-demo
          git clone --depth 1 https://github.com/Malcolmnixon/godot-xr-tools-demo.git references/malcolm-demo

          printf "This directory is an external reference snapshot.\n" > references/flynn-demo/.gdignore
          printf "This directory is an external reference snapshot.\n" > references/malcolm-demo/.gdignore

          rm -rf references/flynn-demo/.git references/malcolm-demo/.git

      - name: Write integration record
        shell: bash
        run: |
          cat > docs/UNIFIED_XR_INTEGRATION.md <<'EOF'
          # Unified XR Integration

          ## Destination

          Personal-quest-development- is now a single Godot project.

          ## Active foundation

          - Godot XR Template: project boot, Quest/Android export structure, startup flow.
          - Godot XR Tools: canonical XR interaction/locomotion library and demo scenes.
          - Startup: Quest vendor integration and project governance/reference documentation.

          ## Preserved references

          - references/flynn-demo/
          - references/malcolm-demo/
          - docs/startup-reference/

          The Flynn and Malcolm projects are intentionally preserved verbatim as reference
          sources because they use different XR Tools generations and/or older Godot scene
          formats. Their project.godot files are not allowed to override the destination
          project's configuration.

          ## Compatibility rule

          A scene is only promoted into the active project when every dependency it needs
          is also promoted or replaced by an equivalent compatible dependency.

          We do not merge multiple OpenXR initialization paths, multiple XR origins, or
          incompatible XR Tools addon generations.

          ## Current active demo capabilities

          The current XR Tools foundation already supplies the compatible implementations
          for grabbing, throwing, teleportation, direct movement, turning, climbing,
          gliding, wind-assisted movement, flight, haptics, spatial UI, and staging.

          ## Next promotion boundary

          Flynn and Malcolm-specific scenes can be ported individually after their exact
          dependencies are mapped. The original sources remain available in references/
          so no source behavior is lost while compatibility work is performed.
          EOF

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f game/main.tscn
          test -f game/start_scene/start_scene.tscn
          test -f addons/godot-xr-tools/plugin.cfg
          test -f addons/godotopenxrvendors/plugin.gdextension
          test -f references/flynn-demo/project.godot
          test -f references/malcolm-demo/project.godot

          grep -q 'run/main_scene="res://game/main.tscn"' project.godot
          grep -q 'res://addons/godot-xr-tools/plugin.cfg' project.godot

      - name: Commit assembled project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "XR Integration Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No assembly changes detected."
            exit 0
          fi
          git commit -m "Assemble unified XR project from compatible reference foundations"
          git push
